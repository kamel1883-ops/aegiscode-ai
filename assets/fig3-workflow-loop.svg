<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-label="The AegisCode workflow loop">
  <defs>
<marker id="arrow-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
<marker id="arrow-0D9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker>
<marker id="arrow-B91C1C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/></marker>
<marker id="arrow-B45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
<marker id="arrow-15803D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803D"/></marker>
</defs>
  <rect width="1040" height="560" fill="#FFFFFF"/>
  <text x="30" y="46" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">The AegisCode workflow loop</text>
  <line x1="30" y1="62" x2="1010" y2="62" stroke="#0F172A" stroke-width="2"/>
  <text x="30" y="95" font-size="15" font-weight="400" fill="#64748B" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Submit → isolated experiment → causal verdict → human decision → back to submit</text><rect x="60" y="170" width="180" height="130" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/><text x="76" y="204" font-size="15" font-weight="700" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">1. Submit</text><text x="76" y="234" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">scenario + original</text>
  <text x="76" y="250.875" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">+ patched code</text><rect x="270" y="170" width="180" height="130" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/><text x="286" y="204" font-size="15" font-weight="700" fill="#0D9488" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">2. Isolated run</text><text x="286" y="234" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">4 conditions, 4</text>
  <text x="286" y="250.875" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">separate agents</text><rect x="480" y="170" width="180" height="130" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="496" y="204" font-size="15" font-weight="700" fill="#B45309" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">3. Validity gates</text><text x="496" y="234" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">completion · behavior</text>
  <text x="496" y="250.875" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">· intervention proof</text><rect x="690" y="170" width="180" height="130" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="706" y="204" font-size="15" font-weight="700" fill="#15803D" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">4. Causal verdict</text><text x="706" y="234" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">one of four verdicts</text>
  <text x="706" y="250.875" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">+ evidence</text><rect x="860" y="170" width="180" height="130" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/><text x="876" y="204" font-size="15" font-weight="700" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">5. Human decision</text><text x="876" y="234" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">approve / reject,</text>
  <text x="876" y="250.875" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">recorded once</text><line x1="244" y1="235" x2="266" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#arrow-334155)"/><line x1="454" y1="235" x2="476" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#arrow-334155)"/><line x1="664" y1="235" x2="686" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#arrow-334155)"/><line x1="874" y1="235" x2="856" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#arrow-334155)"/><line x1="950" y1="304" x2="950" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#arrow-334155)"/><path d="M 950 370 L 150 370" stroke="#334155" stroke-width="2" fill="none"/><line x1="150" y1="370" x2="150" y2="304" stroke="#334155" stroke-width="2" marker-end="url(#arrow-334155)"/><text x="570" y="400" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">approved → next patch iteration · rejected → back to the author</text><rect x="60" y="440" width="920" height="120" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="7 6"/><text x="80" y="472" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Hard rules enforced by design:</text><text x="80" y="500" font-size="13.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• timeout / crash / incomplete run = failure, never success</text><text x="80" y="524" font-size="13.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• setup failures and test failures are logged separately — never counted in place of each other</text><text x="80" y="548" font-size="13.5" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• no merge/apply/commit interface exists: adoption stays a documented human decision</text>
</svg>
