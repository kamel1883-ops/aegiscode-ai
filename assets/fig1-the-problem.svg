<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="The problem: two identical-looking outcomes">
  <defs>
<marker id="arrow-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
<marker id="arrow-0D9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker>
<marker id="arrow-B91C1C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/></marker>
<marker id="arrow-B45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
<marker id="arrow-15803D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803D"/></marker>
</defs>
  <rect width="960" height="520" fill="#FFFFFF"/>
  <text x="30" y="46" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">The problem: two identical-looking outcomes</text>
  <line x1="30" y1="62" x2="930" y2="62" stroke="#0F172A" stroke-width="2"/>
  <text x="30" y="95" font-size="15" font-weight="400" fill="#64748B" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Two situations look identical to a single test — but only one is actually fixed</text><rect x="40" y="130" width="410" height="160" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="60" y="165" font-size="16" font-weight="700" fill="#15803D" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Real fix</text>
  <text x="60" y="186.6" font-size="16" font-weight="700" fill="#15803D" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">The patch removed the exploit path.</text><text x="60" y="215" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Single test says: PASS</text>
  <text x="60" y="233.9" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Reality: the vulnerability is gone.</text><rect x="510" y="130" width="410" height="160" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="530" y="165" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Environment mask</text>
  <text x="530" y="186.6" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">The test environment withheld the resource.</text><text x="530" y="215" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Single test says: PASS</text>
  <text x="530" y="233.9" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Reality: the vulnerability is fully alive.</text><line x1="480" y1="210" x2="480" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow-334155)"/><line x1="450" y1="210" x2="505" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow-334155)"/><rect x="40" y="330" width="880" height="70" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/><text x="480" y="360" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Both produce the same conventional signal: "the unsafe event stopped recurring"</text><text x="480" y="385" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">…so a single test cannot tell them apart — and the masked case ships a broken product with false confidence.</text><line x1="480" y1="400" x2="480" y2="440" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-0D9488)"/><rect x="240" y="440" width="480" height="56" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/><text x="480" y="474" font-size="16" font-weight="700" fill="#0D9488" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">AegisCode AI separates them with a causal experiment</text>
</svg>
