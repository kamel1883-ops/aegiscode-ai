<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-label="The four-condition causal matrix">
  <defs>
<marker id="arrow-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
<marker id="arrow-0D9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker>
<marker id="arrow-B91C1C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/></marker>
<marker id="arrow-B45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
<marker id="arrow-15803D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803D"/></marker>
</defs>
  <rect width="1040" height="640" fill="#FFFFFF"/>
  <text x="30" y="46" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">The four-condition causal matrix</text>
  <line x1="30" y1="62" x2="1010" y2="62" stroke="#0F172A" stroke-width="2"/>
  <text x="30" y="95" font-size="15" font-weight="400" fill="#64748B" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Two factors crossed: code version × resource availability (the controlled variable)</text><text x="270" y="126" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">a: baseline (resource withheld)</text><text x="704" y="126" font-size="15" font-weight="700" fill="#0D9488" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">b: substituted resource (guaranteed)</text><text x="46" y="197" font-size="15" font-weight="700" fill="#0F172A" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">Original S</text><text x="46" y="341" font-size="15" font-weight="700" fill="#0F172A" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">Patched P</text><rect x="60" y="140" width="420" height="130" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/><text x="80" y="178" font-size="16" font-weight="700" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">A — flaw does NOT recur</text><text x="80" y="208" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">the resource is withheld,</text>
  <text x="80" y="225.55" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">so the path was never tested</text><rect x="494" y="140" width="420" height="130" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="514" y="178" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">B — flaw RECURS</text><text x="514" y="208" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">the resource is guaranteed:</text>
  <text x="514" y="225.55" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">the premise is established</text><rect x="60" y="284" width="420" height="130" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/><text x="80" y="322" font-size="16" font-weight="700" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">C — does NOT recur</text><text x="80" y="352" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">the ambiguous success a</text>
  <text x="80" y="369.55" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">single test would report</text><rect x="494" y="284" width="420" height="130" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="514" y="322" font-size="16" font-weight="700" fill="#15803D" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">D — does NOT recur</text><text x="514" y="352" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">with the resource guaranteed:</text>
  <text x="514" y="369.55" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">the fix actually holds</text><line x1="704" y1="414" x2="704" y2="448" stroke="#B91C1C" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-B91C1C)"/><rect x="60" y="454" width="920" height="46" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 5"/><text x="520" y="483" font-size="14" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Premise gate: if B does not recur, no fix verdict is possible — the result is inconclusive.</text><line x1="520" y1="500" x2="520" y2="536" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-0D9488)"/><text x="60" y="564" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Verdicts over C and D (all gates must pass first: completion, legitimate behavior, validity proof):</text><rect x="60" y="584" width="220" height="74" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="170" y="616" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">patch_supported</text><text x="170" y="640" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">no recurrence in C and D</text><rect x="296" y="584" width="220" height="74" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="406" y="616" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">environment_masked</text><text x="406" y="640" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">recurs in D (or both)</text><rect x="532" y="584" width="220" height="74" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="642" y="616" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">interaction_dependent</text><text x="642" y="640" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">recurs in C, not D</text><rect x="768" y="584" width="220" height="74" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/><text x="878" y="616" font-size="15" font-weight="700" fill="#64748B" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">inconclusive</text><text x="878" y="640" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">any gate failed</text>
</svg>
