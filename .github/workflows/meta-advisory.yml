# AegisCode AI — bounded live advisory cycle (manual only).
#
# The ONE real end-to-end Meta workflow (tools/meta-advisory.mjs):
#   baseline harness → explain → candidate patch → independent harness
#   verification → summarize → English JSON + Markdown report.
#
# Trigger: ONLY by hand (Actions tab → "meta-advisory" → Run workflow).
# Never on push, pull requests, or a schedule — no code change or outside
# contributor can spend credits.
#
# Secret wiring (same single consumer pattern as meta-smoke):
#   Repository secret META_API_KEY on kamel1883-ops/aegiscode-ai.
#   This workflow passes it explicitly to this one job only:
#     env: META_API_KEY: ${{ secrets.META_API_KEY }}
#   Logs print model, usage, cost and request ids — never the key.
#
# Budget: ONE $0.05 reservation covers the whole explain+patch+summarize
# cycle (envelope $0.040325 at the verified table). Same durable ledger
# (ci-budget/, actions/cache, SAME BudgetManager rules: $10 total · $5/day ·
# $2/job default · $3 absolute · one live job · no reset). Fail-closed on a
# missing ledger; any stage failure stops the run and its status IS the
# report. Shares the "meta-smoke" concurrency group so only one live job
# runs at a time across both workflows.
#
# Model boundaries: the model never controls the verdict, assertions, or
# sandbox policy; the candidate runs only inside the harness CLI sandbox;
# nothing is applied, merged, or deployed.

name: meta-advisory

on:
  workflow_dispatch:
    inputs:
      confirm_first_run:
        description: 'No budget ledger found yet — tick ONLY for the explicitly approved first validation session'
        type: boolean
        default: false

permissions:
  contents: read

# One live job at a time, shared with the smoke probe.
concurrency:
  group: meta-smoke
  cancel-in-progress: false

jobs:
  advisory:
    name: live advisory cycle (≤ $0.05)
    runs-on: ubuntu-latest
    env:
      META_API_KEY: ${{ secrets.META_API_KEY }}
      META_MODEL_ID: muse-spark-1.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: restore budget ledger (fail-closed on miss)
        uses: actions/cache/restore@v4
        with:
          path: ci-budget
          key: meta-budget-v1
          restore-keys: meta-budget-
      - name: one bounded advisory cycle
        run: node tools/meta-advisory.mjs --budget-dir ci-budget --out-dir advisory-out ${{ inputs.confirm_first_run && '--first-run' || '' }}
      - name: upload advisory report (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisory-report
          path: advisory-out
          retention-days: 90
      - name: persist budget ledger (always, even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ci-budget
          key: meta-budget-v1-${{ github.run_id }}
